<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FFFFFF"/>
  <g transform="translate(130, 20)">
    <!-- Shadow -->
    <ellipse cx="70" cy="250" rx="65" ry="10" fill="#E2E8F0"/>
    
    <!-- Stand-Up Kraft / Foil Zipper Pouch -->
    <path d="M30 40 L110 40 L130 220 Q130 245 70 245 Q10 245 10 220 Z" fill="url(#standUpGrad)" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Zipper Top Seal -->
    <rect x="28" y="40" width="84" height="12" rx="2" fill="#94A3B8"/>
    <circle cx="95" cy="46" r="3" fill="#FFFFFF"/>
    
    <!-- Clear Oval Window showing Powder -->
    <ellipse cx="70" cy="190" rx="35" ry="20" fill="#F59E0B" opacity="0.9" stroke="#FFFFFF" stroke-width="2"/>
    <ellipse cx="70" cy="190" rx="25" ry="12" fill="#FBBF24" opacity="0.8"/>
    
    <!-- Printed Brand Box Label -->
    <rect x="25" y="70" width="90" height="95" rx="6" fill="#FFFFFF" stroke="#0A2E1D" stroke-width="1.5"/>
    <rect x="30" y="75" width="80" height="85" rx="4" fill="none" stroke="#F59E0B" stroke-width="1"/>
    
    <circle cx="70" cy="98" r="12" fill="#0A2E1D"/>
    <path d="M65 101 C65 93 75 93 75 101 Z" fill="#F59E0B"/>
    <text x="70" y="125" font-family="'Outfit', 'Inter', sans-serif" font-size="10" font-weight="800" fill="#0A2E1D" text-anchor="middle">IMM FOOD</text>
    <text x="70" y="136" font-family="'Outfit', 'Inter', sans-serif" font-size="8" font-weight="600" fill="#C84B31" text-anchor="middle">INNOVATORS</text>
    <text x="70" y="148" font-family="'Inter', sans-serif" font-size="7" font-weight="500" fill="#64748B" text-anchor="middle">StandUp Zipper</text>
  </g>
  
  <defs>
    <linearGradient id="standUpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>
</svg>
