<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <path id="arcTopHACCPInner" d="M 36,95 A 64,64 0 0,1 164,95" fill="none" />
    <path id="arcBottomHACCPInner" d="M 164,105 A 64,64 0 0,1 36,105" fill="none" />
    <path id="arcBottomHACCPOuter" d="M 190,105 A 90,90 0 0,1 10,105" fill="none" />
  </defs>

  <!-- Outer Double Blue Circle Rings -->
  <circle cx="100" cy="100" r="95" fill="#FFFFFF" stroke="#1E56A0" stroke-width="3" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#1E56A0" stroke-width="1.5" />
  <circle cx="100" cy="100" r="70" fill="none" stroke="#1E56A0" stroke-width="3" />
  <circle cx="100" cy="100" r="64" fill="none" stroke="#1E56A0" stroke-width="1" />

  <!-- Inner Arc Text: CERTIFIED (Top) & FOOD SAFETY (Bottom) -->
  <text font-family="'Impact', 'Arial Black', 'Outfit', sans-serif" font-size="15" font-weight="900" fill="#1E56A0" letter-spacing="2.5">
    <textPath href="#arcTopHACCPInner" startOffset="50%" text-anchor="middle">CERTIFIED</textPath>
  </text>
  <text font-family="'Impact', 'Arial Black', 'Outfit', sans-serif" font-size="15" font-weight="900" fill="#1E56A0" letter-spacing="2.5">
    <textPath href="#arcBottomHACCPInner" startOffset="50%" text-anchor="middle">FOOD SAFETY</textPath>
  </text>

  <!-- Outer Arc Subtext along Bottom Circle: Hazard Analysis Critical Control Point -->
  <text font-family="'Arial', 'Segoe UI', sans-serif" font-size="8.5" font-weight="bold" fill="#1E56A0" letter-spacing="0.2">
    <textPath href="#arcBottomHACCPOuter" startOffset="50%" text-anchor="middle">Hazard Analysis Critical Control Point</textPath>
  </text>

  <!-- Center Rectangular Box containing HACCP -->
  <rect x="24" y="80" width="152" height="40" rx="6" fill="#FFFFFF" stroke="#1E56A0" stroke-width="3.5" />
  <rect x="27" y="83" width="146" height="34" rx="4" fill="none" stroke="#1E56A0" stroke-width="1" />
  <text x="100" y="111" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#1E56A0" text-anchor="middle" letter-spacing="2">HACCP</text>
</svg>
