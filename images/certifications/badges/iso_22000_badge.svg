  <text x="80" y="80" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">22000:2018</text>
  <text x="80" y="96" font-family="'Outfit', 'Inter', sans-serif" font-size="9" font-weight="700" fill="#F59E0B" text-anchor="middle" letter-spacing="0.5">FOOD SAFETY</text>

