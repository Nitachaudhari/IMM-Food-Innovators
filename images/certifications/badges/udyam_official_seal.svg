<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Text Paths for Circular Arcs -->
    <path id="arcTopUdyamOrange" d="M 24,100 A 76,76 0 0,1 176,100" fill="none" />
    <path id="arcBottomUdyamOrange" d="M 176,100 A 76,76 0 0,1 24,100" fill="none" />
  </defs>

  <!-- Outer Orange Rings -->
  <circle cx="100" cy="100" r="95" fill="#FFFFFF" stroke="#ED7D31" stroke-width="4.5" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="#ED7D31" stroke-width="1.5" />
  <circle cx="100" cy="100" r="66" fill="none" stroke="#ED7D31" stroke-width="4.5" />

  <!-- Outer Ring Text: UDYAM REGISTRATION (Top) & MSME INDIA (Bottom) -->
  <text font-family="'Outfit', 'Arial Black', sans-serif" font-size="15.5" font-weight="900" fill="#ED7D31" letter-spacing="2">
    <textPath href="#arcTopUdyamOrange" startOffset="50%" text-anchor="middle">UDYAM REGISTRATION</textPath>
  </text>
  
  <!-- Bottom arc line accents -->
  <path d="M 38,154 A 76,76 0 0,0 58,168" fill="none" stroke="#ED7D31" stroke-width="3" stroke-linecap="round" />
  <text font-family="'Outfit', 'Arial Black', sans-serif" font-size="14.5" font-weight="900" fill="#ED7D31" letter-spacing="2">
    <textPath href="#arcBottomUdyamOrange" startOffset="50%" text-anchor="middle">MSME INDIA</textPath>
  </text>
  <path d="M 142,168 A 76,76 0 0,0 162,154" fill="none" stroke="#ED7D31" stroke-width="3" stroke-linecap="round" />

  <!-- Center UD Emblem (Stylized U with Arrow + D with Gear Icon) -->
  <g transform="translate(100, 95)" fill="#ED7D31">
    <!-- Stylized U with Upward Arrow -->
    <path d="
      M -36,-18 
      L -22,-18 
      L -22,12 
      C -22,24 -12,30 -2,30 
      C 8,30 18,24 18,12 
      L 18,-4 
      L 8,-4 
      L 8,12 
      C 8,18 4,20 -2,20 
      C -8,20 -12,18 -12,12 
      L -12,-18 
      Z
    " />
    
    <!-- Upward Arrow on U -->
    <polygon points="-2,-38 12,-18 -16,-18" />
    
    <!-- Stylized D attached to right side -->
    <path d="
      M -2,0 
      L 18,0 
      C 34,0 44,10 44,22 
      C 44,34 34,44 18,44 
      L -2,44 
      Z
      M 16,12
      C 24,12 30,16 30,22
      C 30,28 24,32 16,32
      L 10,32
      L 10,12
      Z
    " transform="translate(0, -14)" />

    <!-- Gear / Cog Wheel Icon inside D -->
    <g transform="translate(18, 8)">
      <circle cx="0" cy="0" r="10" fill="#ED7D31" />
      <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
      <!-- Gear Teeth -->
      <path d="
        M -2,-13 L 2,-13 L 2,-10 L -2,-10 Z
        M -2,10 L 2,10 L 2,13 L -2,13 Z
        M -13,-2 L -13,2 L -10,2 L -10,-2 Z
        M 10,-2 L 10,2 L 13,2 L 13,-2 Z
        M -9,-9 L -6,-12 L -4,-10 L -7,-7 Z
        M 6,6 L 9,9 L 7,11 L 4,8 Z
        M 6,-9 L 9,-6 L 7,-4 L 4,-7 Z
        M -9,6 L -6,9 L -4,7 L -7,4 Z
      " fill="#ED7D31" />
    </g>
  </g>
</svg>
