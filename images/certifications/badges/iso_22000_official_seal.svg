<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Text Paths for Circular Arcs -->
    <path id="arcTopISO22Green" d="M 24,100 A 76,76 0 0,1 176,100" fill="none" />
    <path id="arcBottomISO22Green" d="M 176,100 A 76,76 0 0,1 24,100" fill="none" />
  </defs>

  <!-- Outer Ring with Green Border -->
  <circle cx="100" cy="100" r="96" fill="#FFFFFF" stroke="#419F44" stroke-width="4.5" />
  <circle cx="100" cy="100" r="89" fill="none" stroke="#419F44" stroke-width="1.5" />

  <!-- Outer Circular Text: FOOD SAFETY MANAGEMENT SYSTEM (Top) & ★ CERTIFIED ★ (Bottom) -->
  <text font-family="'Impact', 'Arial Black', 'Outfit', sans-serif" font-size="12.5" font-weight="900" fill="#419F44" letter-spacing="1">
    <textPath href="#arcTopISO22Green" startOffset="50%" text-anchor="middle">FOOD SAFETY MANAGEMENT SYSTEM</textPath>
  </text>
  <text font-family="'Impact', 'Arial Black', 'Outfit', sans-serif" font-size="13" font-weight="900" fill="#419F44" letter-spacing="2">
    <textPath href="#arcBottomISO22Green" startOffset="50%" text-anchor="middle">★ CERTIFIED ★</textPath>
  </text>

  <!-- Inner Vibrant Green Filled Circle -->
  <circle cx="100" cy="100" r="66" fill="#419F44" />

  <!-- Center Text: ISO & 22000:2018 -->
  <text x="100" y="93" font-family="'Impact', 'Arial Black', 'Outfit', sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ISO</text>
  <text x="100" y="122" font-family="'Impact', 'Arial Black', 'Outfit', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">22000:2018</text>
</svg>
