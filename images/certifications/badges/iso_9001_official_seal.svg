<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Text Paths for Circular Arcs -->
    <path id="arcTopISO9Blue" d="M 26,100 A 74,74 0 0,1 174,100" fill="none" />
    <path id="arcBottomISO9Blue" d="M 174,100 A 74,74 0 0,1 26,100" fill="none" />
  </defs>

  <!-- Outer Ring with Blue Border -->
  <circle cx="100" cy="100" r="96" fill="#FFFFFF" stroke="#0D47A1" stroke-width="4.5" />
  <circle cx="100" cy="100" r="90" fill="none" stroke="#0D47A1" stroke-width="1.5" />

  <!-- Outer Circular Text: CERTIFIED (Top) & COMPANY (Bottom) -->
  <text font-family="'Impact', 'Arial Black', 'Outfit', sans-serif" font-size="17" font-weight="900" fill="#0D47A1" letter-spacing="3.5">
    <textPath href="#arcTopISO9Blue" startOffset="50%" text-anchor="middle">CERTIFIED</textPath>
  </text>
  <text font-family="'Impact', 'Arial Black', 'Outfit', sans-serif" font-size="17" font-weight="900" fill="#0D47A1" letter-spacing="3.5">
    <textPath href="#arcBottomISO9Blue" startOffset="50%" text-anchor="middle">COMPANY</textPath>
  </text>

  <!-- Inner Blue Filled Circle -->
  <circle cx="100" cy="100" r="67" fill="#0D47A1" />

  <!-- Globe Lattice Wireframe (Latitude / Longitude Grid) -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.2">
    <circle cx="100" cy="100" r="54" />
    <line x1="46" y1="100" x2="154" y2="100" />
    <line x1="100" y1="46" x2="100" y2="154" />
    <ellipse cx="100" cy="100" rx="54" ry="20" />
    <ellipse cx="100" cy="100" rx="54" ry="38" />
    <ellipse cx="100" cy="100" rx="20" ry="54" />
    <ellipse cx="100" cy="100" rx="38" ry="54" />
  </g>

  <!-- Center Text: ISO in Serif/Impact, 9001:2015 in Sans-Serif Bold -->
  <text x="100" y="94" font-family="'Impact', 'Arial Black', 'Outfit', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ISO</text>
  <text x="100" y="124" font-family="'Impact', 'Arial Black', 'Outfit', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">9001:2015</text>
</svg>
