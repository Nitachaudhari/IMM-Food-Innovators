    <path id="arcBottomGMPStamp" d="M 176,100 A 76,76 0 0,1 24,100" fill="none" />
  </defs>

  <!-- Outer Green Stamp Circles -->
  <circle cx="100" cy="100" r="96" fill="#FFFFFF" stroke="#2E7D32" stroke-width="4" />
