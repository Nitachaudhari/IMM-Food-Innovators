  <circle cx="100" cy="100" r="68" fill="none" stroke="#2E7D32" stroke-width="2.5" />
  <circle cx="100" cy="100" r="63" fill="none" stroke="#2E7D32" stroke-width="1.5" stroke-dasharray="3,2" />

  <!-- Outer Ring Text: GOOD MANUFACTURING PRACTICE -->
  <text font-family="'Impact', 'Arial Black', sans-serif" font-size="11.5" font-weight="900" fill="#2E7D32" letter-spacing="1">
    <textPath href="#arcTopGMPStamp" startOffset="50%" text-anchor="middle">★ GOOD MANUFACTURING PRACTICE ★</textPath>
  </text>
  <text font-family="'Impact', 'Arial Black', sans-serif" font-size="11.5" font-weight="900" fill="#2E7D32" letter-spacing="1">
