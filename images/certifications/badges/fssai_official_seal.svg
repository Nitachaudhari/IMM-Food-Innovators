<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="100%" height="100%">
  <!-- White Background Container -->
  <rect width="240" height="140" fill="#FFFFFF" rx="8" />

  <g transform="translate(10, 10)">
    <!-- Top Orange Horizontal Line -->
    <line x1="25" y1="42" x2="200" y2="42" stroke="#E65100" stroke-width="4.5" stroke-linecap="square" />

    <!-- Stylized FSSAI Typography -->
    <text x="110" y="85" font-family="'Georgia', 'Times New Roman', 'Trebuchet MS', serif" font-size="52" font-weight="900" font-style="italic" fill="#103580" text-anchor="middle" letter-spacing="-2">fssai</text>

    <!-- Brown Seed / Dot above 'i' -->
    <circle cx="178" cy="34" r="3.5" fill="#6D4C41" />

    <!-- Green Leaf above 'i' -->
    <path d="M 178,33 C 179,16 195,19 190,34 C 185,38 180,37 178,33 Z" fill="#2E7D32" />
    <path d="M 180,32 Q 185,25 187,22" fill="none" stroke="#A5D6A7" stroke-width="1.2" />

    <!-- Bottom Green Horizontal Line -->
    <line x1="15" y1="96" x2="188" y2="96" stroke="#2E7D32" stroke-width="4.5" stroke-linecap="square" />
  </g>
</svg>
