<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FFFFFF"/>
  <g transform="translate(140, 30)">
    <!-- Glass Jar Body Shadow -->
    <ellipse cx="60" cy="225" rx="50" ry="10" fill="#E2E8F0"/>
    
    <!-- Glass Jar Back Body & Powder -->
    <rect x="15" y="60" width="90" height="155" rx="15" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M16 110 L104 110 L104 200 Q104 214 90 214 L30 214 Q16 214 16 200 Z" fill="#F59E0B" opacity="0.85"/>
    
    <!-- Highlights -->
    <rect x="22" y="65" width="8" height="140" rx="4" fill="#FFFFFF" opacity="0.6"/>
    
    <!-- Metallic Gold Lid -->
    <rect x="10" y="30" width="100" height="30" rx="6" fill="url(#goldLid)"/>
    <rect x="15" y="25" width="90" height="8" rx="3" fill="#D97706"/>
    
    <!-- Label -->
    <rect x="20" y="90" width="80" height="85" rx="6" fill="#FFFFFF" stroke="#0A2E1D" stroke-width="1.5" box-shadow="0 2px 8px rgba(0,0,0,0.1)"/>
    <rect x="25" y="95" width="70" height="75" rx="4" fill="none" stroke="#F59E0B" stroke-width="1"/>
    
    <!-- Label Text & Logo Icon -->
    <circle cx="60" cy="115" r="10" fill="#0A2E1D"/>
    <path d="M56 117 C56 110 64 110 64 117 Z" fill="#F59E0B"/>
    <text x="60" y="138" font-family="'Outfit', 'Inter', sans-serif" font-size="9" font-weight="800" fill="#0A2E1D" text-anchor="middle">IMM FOOD</text>
    <text x="60" y="148" font-family="'Outfit', 'Inter', sans-serif" font-size="7" font-weight="600" fill="#C84B31" text-anchor="middle">INNOVATORS</text>
    <text x="60" y="158" font-family="'Inter', sans-serif" font-size="6" font-weight="500" fill="#64748B" text-anchor="middle">Glass Can Jar</text>
  </g>
  
  <defs>
    <linearGradient id="goldLid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
</svg>
