<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FFFFFF"/>
  <g transform="translate(130, 20)">
    <!-- Shadow -->
    <ellipse cx="70" cy="245" rx="60" ry="10" fill="#E2E8F0"/>
    
    <!-- Pillow Pouch Body -->
    <path d="M25 45 Q70 30 115 45 L125 225 Q70 245 15 225 Z" fill="url(#pouchGrad)" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Top & Bottom Seals -->
    <path d="M25 45 Q70 30 115 45 L116 55 Q70 40 24 55 Z" fill="#94A3B8"/>
    <path d="M15 225 Q70 245 125 225 L124 233 Q70 252 14 233 Z" fill="#94A3B8"/>
    
    <!-- Highlight Fold -->
    <path d="M30 55 Q70 42 110 55 Q70 140 30 220 Z" fill="#FFFFFF" opacity="0.5"/>
    
    <!-- Printed Brand Box Label -->
    <rect x="25" y="85" width="90" height="105" rx="6" fill="#FFFFFF" stroke="#0A2E1D" stroke-width="1.5"/>
    <rect x="30" y="90" width="80" height="95" rx="4" fill="none" stroke="#F59E0B" stroke-width="1"/>
    
    <circle cx="70" cy="115" r="12" fill="#0A2E1D"/>
    <path d="M65 118 C65 110 75 110 75 118 Z" fill="#F59E0B"/>
    <text x="70" y="142" font-family="'Outfit', 'Inter', sans-serif" font-size="10" font-weight="800" fill="#0A2E1D" text-anchor="middle">IMM FOOD</text>
    <text x="70" y="153" font-family="'Outfit', 'Inter', sans-serif" font-size="8" font-weight="600" fill="#C84B31" text-anchor="middle">INNOVATORS</text>
    <text x="70" y="166" font-family="'Inter', sans-serif" font-size="7" font-weight="500" fill="#64748B" text-anchor="middle">Regular Pouch</text>
  </g>
  
  <defs>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
</svg>
